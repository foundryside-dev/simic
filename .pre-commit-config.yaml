repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv env)
        # mirrors-mypy ran a pinned 1.20.2 in an isolated venv with no torch,
        # so torch resolved to Any and nn.Module subclasses failed [misc] —
        # while masking every torch-typing error before that. This local hook
        # runs the SAME mypy 2.3.0 + torch-aware venv as `uv run mypy .`.
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Generated diagram SVGs are byte-exact mmdc output; "fixing" them here
        # would churn against every re-render (tools/diagrams/render.sh).
        # Archived run evidence under docs/results/ is checksummed by its own
        # complete.json; a whitespace "fix" would silently break those hashes.
        exclude: ^(site/assets/diagrams/|docs/results/.+/)
      - id: end-of-file-fixer
        exclude: ^(site/assets/diagrams/|docs/results/.+/)
      - id: check-yaml
        # mkdocs.yml uses the standard `!!python/name:` superfences tag, which
        # safe-load cannot parse; mkdocs itself validates this file (--strict).
        exclude: ^tools/wiki/mkdocs\.yml$
      - id: check-toml
      - id: check-added-large-files
        # 3 MB ceiling: admits the published HLD PDF (docs/assets/simic-hld.pdf,
        # ~2.4 MB, a deliberate artifact) while still catching accidental blobs.
        args: ['--maxkb=3000']
      - id: check-merge-conflict
