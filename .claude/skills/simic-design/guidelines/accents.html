<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-bg)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--color-border)}.lab{font-family:var(--font-code);font-size:11px;color:var(--color-text-muted);margin-top:4px;white-space:nowrap;overflow:hidden}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--teal-400)"></div><div class="lab">teal-400</div></div><div class="sw"><div class="chip" style="background:var(--teal-600)"></div><div class="lab">teal-600</div></div><div class="sw"><div class="chip" style="background:var(--teal-700)"></div><div class="lab">teal-700</div></div><div style="width:24px"></div><div class="sw"><div class="chip" style="background:var(--amber-400)"></div><div class="lab">amber-400</div></div><div class="sw"><div class="chip" style="background:var(--amber-700)"></div><div class="lab">amber-700</div></div></div></body></html>
