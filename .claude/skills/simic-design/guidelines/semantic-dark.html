<!-- @dsCard group="Colors" viewport="700x230" name="Semantic tokens — dark" subtitle="Same tokens, dark side of every light-dark() pair" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-bg)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--color-border)}.lab{font-family:var(--font-code);font-size:11px;color:var(--color-text-muted);margin-top:4px;white-space:nowrap;overflow:hidden}</style><style>:root{color-scheme:dark !important}</style></head><body><div style="display:flex;flex-direction:column;gap:14px"><div class="row"><div class="sw"><div class="chip" style="background:var(--color-bg)"></div><div class="lab">--color-bg</div></div><div class="sw"><div class="chip" style="background:var(--color-bg-subtle)"></div><div class="lab">--color-bg-subtle</div></div><div class="sw"><div class="chip" style="background:var(--color-bg-code)"></div><div class="lab">--color-bg-code</div></div><div class="sw"><div class="chip" style="background:var(--color-bg-note)"></div><div class="lab">--color-bg-note</div></div></div><div class="row"><div class="sw"><div class="chip" style="background:var(--color-text)"></div><div class="lab">--color-text</div></div><div class="sw"><div class="chip" style="background:var(--color-text-muted)"></div><div class="lab">--color-text-muted</div></div><div class="sw"><div class="chip" style="background:var(--color-heading)"></div><div class="lab">--color-heading</div></div><div class="sw"><div class="chip" style="background:var(--color-accent)"></div><div class="lab">--color-accent</div></div></div><div class="row"><div class="sw"><div class="chip" style="background:var(--color-border)"></div><div class="lab">--color-border</div></div><div class="sw"><div class="chip" style="background:var(--color-border-firm)"></div><div class="lab">--color-border-firm</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-quiet)"></div><div class="lab">--color-accent-quiet</div></div><div class="sw"><div class="chip" style="background:var(--color-warn)"></div><div class="lab">--color-warn</div></div></div></div></body></html>
