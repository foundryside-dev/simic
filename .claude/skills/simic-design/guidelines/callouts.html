<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-bg)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius);border:1px solid var(--color-border)}.lab{font-family:var(--font-code);font-size:11px;color:var(--color-text-muted);margin-top:4px;white-space:nowrap;overflow:hidden}</style></head><body><div class="note" style="margin:0 0 14px;max-width:none;padding:12px 20px;background:var(--color-bg-note);border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:var(--radius)"><span style="display:block;font-family:var(--font-code);font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent);margin-bottom:4px">Read the claims against this</span><p style="margin:0">The architecture's irreducible contributions are the ones that could not be retrofitted.</p></div>
<div style="margin:0;max-width:none;padding:12px 20px;background:var(--color-bg-note-status);border:1px solid var(--color-border);border-left:3px solid var(--color-warn);border-radius:var(--radius)"><span style="display:block;font-family:var(--font-code);font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-warn);margin-bottom:4px">Project status</span><p style="margin:0"><strong>Pre-implementation bootstrap.</strong> Nothing on this site describes a running system.</p></div></body></html>
