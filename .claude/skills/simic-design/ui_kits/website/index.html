<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Simic — website UI kit</title>
<link rel="icon" href="../../assets/mark.svg"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="OverviewScreen.jsx"></script>
<script type="text/babel" src="LineageScreen.jsx"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
function App(){
  const [screen,setScreen]=React.useState(localStorage.getItem("simic-kit-screen")||"overview");
  const nav=s=>{setScreen(s);localStorage.setItem("simic-kit-screen",s);window.scrollTo(0,0);};
  return screen==="lineage"?<window.LineageScreen onNav={nav}/>:<window.OverviewScreen onNav={nav}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
