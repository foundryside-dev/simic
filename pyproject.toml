[project]
name = "simic"
version = "0.1.0"
description = "Counterfactual generative morphogenesis — lifecycle-driven neural training system"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "John Morrissey", email = "544926+tachyon-beep@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "hydra-core>=1.3.5",
    "mlflow>=3.15.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py314"
line-length = 140

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]   # Handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
# Study roots hold immutable source snapshots (git archive of a launch commit); they would
# shadow the live packages, so the gitignored runs/ tree is never type-checked.
exclude = ["^runs/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["torchvision.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config"]
