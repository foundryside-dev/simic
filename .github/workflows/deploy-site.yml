# Deploy simic.foundryside.dev to GitHub Pages.
#
# The published site is two artifacts of different classes, assembled here:
#
#   /          site/ verbatim — three hand-written marketing pages, plain
#              HTML/CSS with no build step, zero JavaScript and zero external
#              requests. Diagrams are pre-rendered SVGs committed under
#              site/assets/diagrams/ (regenerate with tools/diagrams/render.sh).
#   /design/   the design-docs wiki, GENERATED from docs/design/ by mkdocs
#              (tools/wiki/). Never hand-written: edit a chapter, and the wiki
#              follows on the next deploy. JavaScript is fine in this half.
#
# Custom domain is set in the repo's Pages settings; DNS is a CNAME to
# foundryside-dev.github.io, matching the other Weft-family subdomains.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # The wiki is generated from the chapters, so a chapter edit must
      # redeploy even when nothing under site/ changed. ADRs are staged
      # into the wiki too (ADR-0007), so they share the trigger.
      - 'docs/design/**'
      - 'docs/adr/**'
      - 'tools/wiki/**'
      # The pre-upload gates: a change to either must re-run against the
      # current site, not wait for the next content edit to notice it.
      - 'tools/ci/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deploy at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        # Pin the Pages source to GitHub Actions (build_type=workflow); enables
        # Pages if needed. Without this, deploy-pages fails when the repo is
        # still set to "Deploy from a branch".
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/wiki/requirements.txt

      - name: Install wiki build dependencies
        run: pip install -r tools/wiki/requirements.txt

      - name: Set up Java
        # build.sh compiles docs/design/assets/model.dsl to SVGs via the
        # pinned structurizr-cli and plantuml jars; pin the JDK too rather
        # than leaning on whatever the runner image ships.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache diagram toolchain
        # The pinned jars build.sh downloads on first run (~15 MB). Keyed on
        # build.sh because that is where the versions are pinned.
        uses: actions/cache@v4
        with:
          path: tools/wiki/.cache
          key: wiki-diagram-jars-${{ hashFiles('tools/wiki/build.sh') }}

      - name: Build the design-docs wiki
        # build.sh compiles the Structurizr model to SVGs, stages docs/design/
        # into a throwaway copy (plus the generated reference/ registries),
        # applies the render-only transforms, and runs `mkdocs build --strict`
        # — so a broken cross-reference between chapters fails the deploy
        # instead of shipping.
        run: ./tools/wiki/build.sh

      - name: Assemble the Pages artifact
        # site/ at the root, the generated wiki mounted at /design/. Guard the
        # inputs: an empty or missing half would silently publish a broken site.
        run: |
          set -euo pipefail
          test -f site/index.html            || { echo "site/index.html missing"; exit 1; }
          test -f tools/wiki/build/site/index.html || { echo "wiki build produced no index"; exit 1; }

          rm -rf _pages
          mkdir -p _pages
          cp -r site/. _pages/
          test ! -e _pages/design || { echo "site/design would collide with the wiki mount"; exit 1; }
          mkdir -p _pages/design
          cp -r tools/wiki/build/site/. _pages/design/

          echo "assembled: $(find _pages -type f | wc -l) files"
          echo "  root pages:  $(find _pages -maxdepth 1 -name '*.html' | wc -l)"
          echo "  wiki pages:  $(find _pages/design -name '*.html' | wc -l)"

      - name: Validate the hand-written pages
        # The wiki half is gated by `mkdocs build --strict` above; this is the
        # equivalent gate for site/, which is hand-written and had none. Scoped
        # to the ROOT pages on purpose — the generated Material output is the
        # upstream theme's business, not ours, and linting it here would fail
        # the deploy on markup we do not author.
        run: npx --yes html-validate '_pages/*.html'

      - name: Check internal links and fragments
        # Offline: every href/src in the root pages must resolve to a file in
        # the artifact, and every #fragment to a real id on the target page.
        # External URLs are listed, never fetched — a deploy must not fail
        # because GitHub rate-limited us.
        #
        # This exists because the marketing pages deep-link into the generated
        # wiki (/design/02-constitution/#53-the-canonical-sentence). Those slugs
        # are derived from chapter headings, so rewording a heading silently
        # breaks a citation on the other half of the site. That is precisely the
        # class of break --strict catches within the wiki and nothing caught
        # across the seam.
        run: python3 tools/ci/linkcheck.py _pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
